# The public edge. Caddy terminates TLS for *.pwbcloud.com and proxies each
# site to Caddy on Jupiter over the tailnet; CrowdSec decides who gets that
# far (docs/RUNBOOK.md for operating it).
volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  crowdsec_data:
  crowdsec_config:
services:
  caddy:
    # Caddy plus CrowdSec's bouncer and AppSec modules, built on this host by
    # scripts/deploy.sh. Versions are pinned in caddy/Dockerfile.
    build: ./caddy
    image: pluto-caddy:local
    # Host networking, so Caddy sees each client's real address, over IPv6
    # too. Behind Docker's port publishing, IPv6 clients arrive through
    # docker-proxy from the bridge gateway, and CrowdSec would ban the gateway.
    # No `ports:`; nftables (host/nftables.conf) decides what is reachable.
    network_mode: host
    environment:
      JUPITER_TS_IP: ${JUPITER_TS_IP}
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                  # certificates and ACME account
      - caddy_config:/config
      - caddy_logs:/var/log/caddy         # access log, read by CrowdSec
    read_only: true
    tmpfs: [/tmp]
    # Root in the container, but only allowed to bind :80 and :443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      crowdsec:
        condition: service_healthy
    restart: unless-stopped
    labels:
      cosmos.service: system
      # Built here, so no registry to check. Bump caddy/Dockerfile by hand.
      cosmos.update: "off"

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1
    environment:
      # Caddy's log parser and the generic HTTP scenarios, known CVE probes,
      # and AppSec's rules (virtual patches for known CVEs plus generic ones),
      # which Caddy checks every request against before proxying it.
      COLLECTIONS: >-
        crowdsecurity/caddy
        crowdsecurity/http-cve
        crowdsecurity/appsec-virtual-patching
        crowdsecurity/appsec-generic-rules
      # Registers the bouncer Caddy uses, with the key from .env.
      BOUNCER_KEY_caddy: ${CROWDSEC_BOUNCER_KEY}
      USE_WAL: "true"
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ./crowdsec/parsers/s02-enrich/pluto-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/pluto-whitelist.yaml:ro
      - ./crowdsec/simulation.yaml:/etc/crowdsec/simulation.yaml:ro
      - caddy_logs:/var/log/caddy:ro
      # Decisions, alerts and the bouncer's registration.
      - crowdsec_data:/var/lib/crowdsec/data
      # Hub items and the machine's credentials, kept so a restart doesn't
      # register a new machine with CrowdSec's central API each time.
      - crowdsec_config:/etc/crowdsec
    # Loopback only: Caddy (host network) is the one client. AppSec must
    # never be reachable from outside.
    ports:
      - "127.0.0.1:8080:8080"             # local API (decisions)
      - "127.0.0.1:7422:7422"             # AppSec
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    labels:
      cosmos.service: system
