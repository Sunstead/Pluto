services:
  helion-agent:
    # Pinned to the same release as Jupiter's (Jupiter/compose/helion.yml):
    # each release pairs with its helion-agent.toml, and a newer or older agent
    # refuses a config it does not understand. Bump both together.
    image: ghcr.io/sunstead/helion-agent:0.14.0
    container_name: helion-agent
    restart: unless-stopped

    # Required: the agent reads host network stats from /proc/net/dev, which is
    # per network namespace. It binds 127.0.0.1:7700 only (helion-agent.toml);
    # the tailnet reaches it through `tailscale serve` (scripts/bootstrap.sh).
    network_mode: host

    read_only: true                       # rootfs immutable; SQLite is on the named volume
    cap_drop: [ALL]                       # :7700 is above 1024, so no CAP_NET_BIND_SERVICE
    security_opt: [no-new-privileges:true]
    user: "65532:65532"
    group_add: ["${DOCKER_GID}"]          # uid 65532 can't read docker.sock without this

    environment:
      HELION_AGENT_CONFIG: /etc/helion-agent/agent.toml
      HELION_NODE_NAME: pluto
      # Named as ${HOME_DOMAIN} in helion-agent.toml (agent 0.12 and later).
      HOME_DOMAIN: ${HOME_DOMAIN}
      # The secret sent with its heartbeats to Jupiter's agent ([[peers]] in
      # helion-agent.toml). Compose refuses to start without it, before the
      # agent would.
      HELION_AGENT_PEER_TOKEN: ${HELION_AGENT_PEER_TOKEN:?set HELION_AGENT_PEER_TOKEN in .env, the same value as Jupiter's}
      RUST_LOG: "info,helion_agent=info"
      TZ: ${TZ:-Etc/UTC}

    volumes:
      - ./helion-agent.toml:/etc/helion-agent/agent.toml:ro

      # `:ro` on a unix socket is not a security control: anyone who can connect()
      # has the full Docker API. The real control is `allow_actions` in the config.
      - /var/run/docker.sock:/var/run/docker.sock

      # Only the filesystems actually charted, named in [[host.disks]].
      - /:/host/rootfs:ro,rslave

      # Tailnet devices: tailscaled runs on the host here (not in a container,
      # as on Jupiter). uid 65532 gets read-only access from tailscaled.
      - /var/run/tailscale:/host/tailscale

      - helion_agent_data:/var/lib/helion-agent   # SQLite; the only writable path

    labels:
      helion.service: helion
      helion.service.description: Homelab monitoring agent

volumes:
  helion_agent_data:
