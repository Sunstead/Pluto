# Game connections for Lodestone's Minecraft servers on Jupiter:
# play.$PUBLIC_DOMAIN:<port>, raw TCP on LODESTONE_GAME_PORTS, each port
# forwarded to the same port on Jupiter over the tailnet. Nothing else is
# forwarded: no RCON, no query, no SSH. host/nftables.conf opens exactly the
# range, and the tailnet policy lets tag:pluto reach exactly the range.
#
# HAProxy rather than Caddy: Caddy core is HTTP-only, and the layer4 module
# has no per-address connection limits. This keeps the HTTP edge's build and
# config out of it, and a fault here can't take the websites down.
#
# No PROXY protocol: only Paper understands it, and vanilla, Fabric and Forge
# servers refuse every connection that has it. So servers see Pluto (through
# Jupiter) as every player's address: bans by IP don't work there, ban by name.
# The real addresses are in this log.

global
    log stdout format raw local0 info
    # The whole proxy, so a flood can't take all of Pluto's memory.
    maxconn 4000

defaults
    mode tcp
    log global
    # One line per connection, with the player's address and port, how long
    # it lasted and the bytes each way. Connections with no data are logged
    # too: that's what a scanner looks like. Ones refused by the limits
    # below aren't.
    option tcplog
    timeout connect 5s
    # Minecraft keeps a live connection talking (a keep-alive every 15 s and
    # its own 30 s timeout), so a minute of silence is a dead one.
    timeout client 60s
    timeout server 60s
    # A client that sends nothing at all after connecting.
    timeout client-fin 10s

frontend minecraft
    bind "[::]:${LODESTONE_GAME_PORTS}" v4v6
    # Per address: a household with a few players fits; a scanner or a flood
    # from one address doesn't. Limits are on connections, not traffic.
    stick-table type ipv6 size 100k expire 10m store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 8 }
    tcp-request connection reject if { sc_conn_rate(0) gt 15 }
    default_backend jupiter

backend jupiter
    # No port: each connection goes to the port it arrived on.
    server jupiter "${JUPITER_TS_IP}"
