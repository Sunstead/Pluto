# Normal traffic from the apps behind Pluto that the generic HTTP scenarios
# would count against the client. Whitelisted lines are dropped before any
# scenario sees them; AppSec still checks every one of these requests inline.
# Add to this when `cscli alerts list` shows a false positive
# (docs/RUNBOOK.md); keep each entry as narrow as the noise it covers.
name: pluto/app-noise
description: "Expected traffic from OpenCloud, Immich and Solstice clients"
whitelist:
  reason: "app traffic behind Pluto"
  expression:
    # OpenCloud's desktop and mobile clients sync over WebDAV: PROPFIND and
    # friends on paths that may not exist yet, which reads as probing.
    # Matched by the first label: Caddy only serves names under PUBLIC_DOMAIN,
    # which lives in .env.
    - >-
      evt.Meta.target_fqdn startsWith 'files.' &&
      evt.Meta.http_verb in ['PROPFIND', 'PROPPATCH', 'REPORT', 'MKCOL', 'MOVE', 'COPY', 'LOCK', 'UNLOCK']
    # OpenCloud answers an expired sign-in with a 401 and a Basic challenge
    # (for app tokens), which reads as brute force. A client whose token
    # lapsed while Authentik was unreachable retries its uploads and gets
    # one each. Nothing guessable sits behind it: passwords only go to
    # Authentik (basic auth with a password is off), and app tokens are
    # random.
    - evt.Meta.target_fqdn startsWith 'files.' && evt.Meta.http_status == '401'
    # The bouncer's own 403s. Once an address is banned, every request its
    # apps retry gets one, and counting those as probing renews the ban
    # for as long as the apps keep trying. An address with a decision
    # already has its ban; the status check first keeps the lookup off
    # every other line.
    - evt.Meta.http_status == '403' && GetActiveDecisionsCount(evt.Meta.source_ip) > 0
    # Solstice Sync's clients download attachments as one GET per blob, dozens
    # in a burst, which http-crawl-non_statics counts as crawling. Only
    # successful downloads under a vault: a 404 here still counts as probing,
    # and every /v1 route needs a sign-in.
    - >-
      evt.Meta.target_fqdn startsWith 'notes.' &&
      evt.Meta.http_verb == 'GET' &&
      evt.Meta.http_status == '200' &&
      evt.Meta.http_path matches '^/v1/vaults/[0-9a-f-]+/blobs/'
