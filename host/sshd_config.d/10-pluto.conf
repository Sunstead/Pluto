# Installed as /etc/ssh/sshd_config.d/10-pluto.conf. The first value sshd
# reads wins, and this file sorts before cloud-init's 50-cloud-init.conf.
#
# Keys only, no root, admins only. Port 22 is open on the tailnet alone
# (host/nftables.conf); the password set by bootstrap.sh is for the OVH KVM
# console and sudo, never for SSH.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowGroups sudo

MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
