# Drop-in for tailscaled.service. The stock unit has systemd delete
# /run/tailscale whenever tailscaled stops (an upgrade, a restart) and make a
# new one on start. The Cosmos agent bind-mounts that directory, so it would
# be left holding the deleted one, and the tailnet would vanish from Cosmos
# until the agent restarted. Keep the directory; tailscaled's socket comes
# back inside it.
[Service]
RuntimeDirectoryPreserve=yes
