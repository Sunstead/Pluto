#!/usr/sbin/nft -f
# Pluto's host firewall, installed as /etc/nftables.conf by
# scripts/bootstrap.sh and loaded at boot by nftables.service.
#
# Only this one table. Docker and Tailscale keep their own rules, so this
# file must never `flush ruleset` (Debian's stock nftables.conf does, and so
# does the stock service on stop; host/nftables.service.d fixes that).
# Re-loading it is safe: the table is replaced as a whole.
#
# Public: 80 and 443 (Caddy) and Tailscale's port. SSH and the Cosmos agent
# only over the tailnet. Containers' published ports are bound to 127.0.0.1
# (compose/edge.yml).

table inet pluto
delete table inet pluto

table inet pluto {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        # Ping, rate-limited, and the ICMP errors path MTU discovery needs.
        icmp type echo-request limit rate 10/second burst 20 packets accept
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        # IPv6 doesn't work without neighbour discovery.
        icmpv6 type echo-request limit rate 10/second burst 20 packets accept
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept

        # DHCP replies. A renewal's answer is tracked, but once a lease has
        # run out the offer comes as a broadcast that isn't, and dropping it
        # would cost Pluto its address.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # Caddy, the public edge.
        tcp dport { 80, 443 } accept

        # Tailscale's direct connections. Without it the tunnel to Jupiter
        # still works, but through a DERP relay, which is much slower.
        udp dport 41641 accept

        # SSH from the tailnet only. The tailnet policy already limits who
        # gets here; this keeps the public side shut even if it didn't.
        iifname "tailscale0" tcp dport 22 accept

        # The Cosmos agent, through `tailscale serve` (scripts/bootstrap.sh),
        # which listens on Pluto's Tailscale addresses like any other server.
        iifname "tailscale0" tcp dport 7700 accept
    }
}
